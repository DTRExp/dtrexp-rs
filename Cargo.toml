[package]
name = "dtrexp"
version = "0.1.0"
edition = "2021"
description = "Date-Time Range & Recurrence Expression — a compact coverage-expression language (DTRExp draft 2.8)"
license = "MIT"

[lib]
name = "dtrexp"
path = "src/lib.rs"

[features]
# Host-supplied time zones: `Tz::from_offset_fn` builds a zone from an offset
# callback instead of the system TZif database, for hosts without a zoneinfo
# filesystem (WASM).
host-tz = []

[dependencies]

[dev-dependencies]

[profile.test]
opt-level = 0
